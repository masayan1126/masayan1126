# 問い合わせフォームの送信先 (2026-09-25)。studio.msyn.me/api/contact への POST を受け、
# Cloudflare Email Routing の送信機能で、確認済みの受信アドレスへメールを届ける。
# 受信アドレスは公開リポジトリに書かないため、シークレット TO に入れる:
#   npx wrangler secret put TO      (Email Routing で確認済みのアドレスを入力)
name = "miyabiya-contact"
main = "src/index.js"
compatibility_date = "2026-09-04"
routes = [{ pattern = "studio.msyn.me/api/contact", zone_name = "msyn.me" }]

[[send_email]]
name = "MAILER"

# A dedicated namespace; counters apply per IP and Cloudflare location.
# Turnstile secret is stored with `wrangler secret put TURNSTILE_SECRET_KEY`.
[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1740937261"
[ratelimits.simple]
limit = 5
period = 60
