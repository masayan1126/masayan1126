<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>デザインカンプ | Miyabiya Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#262c35;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{padding:24px 28px;background:white;border-bottom:1px solid #dde2e6;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{margin:0;font-size:21px}a{color:#133f8f;text-underline-offset:4px}main{padding:22px 24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,select{font:inherit;font-size:14px;padding:11px 16px;border:1px solid #cbd2dc;border-radius:9px;background:white;color:#263246;cursor:pointer}button[aria-pressed=true]{background:#133f8f;color:white;border-color:#133f8f}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #4164a5;outline-offset:3px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.pane{min-width:0}h2{font-size:15px;margin:0 0 10px}.window{height:72vh;min-height:430px;position:relative;overflow:hidden;border:1px solid #d5dbe4;border-radius:12px;background:white;margin:auto}iframe{display:block;border:0;transform-origin:top left;background:white}.details{max-width:1440px;margin:auto}.details select{margin-bottom:14px;max-width:100%}.details iframe{width:100%;height:74vh;border:1px solid #d5dbe4;border-radius:12px}.mobile .window{max-width:392px}[hidden]{display:none!important}@media(max-width:700px){header{padding:18px;align-items:flex-start;flex-direction:column}h1{font-size:19px}main{padding:18px}.comparison{grid-template-columns:1fr}.window{height:70vh}nav button{padding:10px 13px}}
</style></head><body>
<header><h1>Miyabiya Studio デザインカンプ</h1><a href="/" target="_blank" rel="noopener">プロフィールサイトを見る ↗</a></header>
<main><nav aria-label="表示を切り替える"><button type="button" data-view="desktop" aria-pressed="true">PC比較</button><button type="button" data-view="mobile" aria-pressed="false">スマホ比較</button><button type="button" data-view="details" aria-pressed="false">詳細ページ</button></nav>
<section id="comparison" class="comparison" aria-label="修正前と修正後の比較">
<div class="pane"><h2>修正前</h2><div class="window"><iframe src="/design/original/" title="修正前のトップページ"></iframe></div></div>
<div class="pane"><h2>別案 V3</h2><div class="window"><iframe src="/" title="別案V3のトップページ"></iframe></div></div>
</section>
<section id="details" class="details" hidden><label for="page">ページを選ぶ </label><select id="page"><option value="/profile/">プロフィール・経歴</option><option value="/works/">実績</option><option value="/services/">開発・AI導入</option><option value="/media/">YouTube・PR・コラボ</option><option value="/talks/">技術登壇</option><option value="/membership/">メンバーシップ</option><option value="/contact/">お問い合わせ</option><option value="/pricing/">料金表</option></select><iframe src="/profile/" title="選択した詳細ページ"></iframe></section>
</main><script>
const comparison=document.getElementById('comparison');const details=document.getElementById('details');let mode=matchMedia('(max-width:700px)').matches?'mobile':'desktop';
function fit(){if(mode==='details')return;const width=mode==='mobile'?392:1459;comparison.querySelectorAll('.window').forEach(w=>{const iframe=w.querySelector('iframe');const scale=w.clientWidth/width;iframe.style.width=width+'px';iframe.style.height=w.clientHeight/scale+'px';iframe.style.transform='scale('+scale+')';});}
function show(view){mode=view;comparison.hidden=view==='details';details.hidden=view!=='details';comparison.classList.toggle('mobile',view==='mobile');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));fit();}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));document.getElementById('page').addEventListener('change',e=>details.querySelector('iframe').src=e.target.value);window.addEventListener('resize',fit);show(mode);
</script></body></html>
