<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Miyabiya Studio — サイト全体</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9e9e6;color:#252c33;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #133f8f;outline-offset:3px}.review-bar{display:flex;align-items:center;gap:18px;height:66px;padding:0 20px;background:#fff;border-bottom:1px solid #dfe1df}.review-brand{font-size:12px;white-space:nowrap}.tabs{display:flex;gap:3px;margin:auto;overflow:auto;align-self:stretch;min-width:0}.tabs button{flex:none;min-height:44px;border:0;border-bottom:2px solid transparent;padding:0 12px;background:none;font-size:11px;white-space:nowrap}.tabs button[aria-selected=true]{color:#133f8f;border-color:#133f8f;background:#f3f5f7}.tools{display:flex;gap:8px;flex:none}.tools button{min-height:38px;border:1px solid #d5d9db;border-radius:3px;padding:0 12px;font-size:11px;background:#fff}.preview{height:calc(100svh - 66px);display:flex;justify-content:center}.preview iframe{display:block;width:100%;height:100%;border:0;background:#fff}.mobile iframe{width:390px;max-width:100%}.exit{display:none;position:fixed;right:8px;top:50%;writing-mode:vertical-rl;z-index:200;min-height:106px;padding:12px 7px;border:1px solid #bac4cc;border-radius:3px;background:#fffffff0;font-size:11px}.presentation .review-bar{display:none}.presentation .preview{height:100svh}.presentation .exit{display:block}
@media(max-width:1100px){.review-bar{height:110px;flex-wrap:wrap;padding:8px 16px 0;gap:0 12px}.review-brand{flex:1}.tools{margin-left:auto}.tabs{order:3;width:100%;height:54px;margin:0}.tabs button{padding:0 14px}.preview{height:calc(100svh - 110px)}}@media(max-width:480px){.tools #phone{display:none}.tabs button{padding:0 12px}.review-brand{font-size:11px}}
</style></head><body><header class="review-bar"><b class="review-brand">Miyabiya Studio</b><nav class="tabs" role="tablist" aria-label="ページの確認">%%TABS%%</nav><div class="tools"><button id="phone" aria-pressed="false">スマホ幅</button><button id="expand">画面を広げる</button></div></header><main class="preview" id="preview" role="tabpanel" aria-labelledby="page-0"><iframe id="site-frame" title="トップ" src="/" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe></main><button class="exit" id="exit">ページ一覧に戻る</button><script>
const frame=document.querySelector('#site-frame'),tabs=[...document.querySelectorAll('[data-path]')],preview=document.querySelector('#preview');
function select(button,focus=false){for(const tab of tabs){const on=tab===button;tab.setAttribute('aria-selected',on);tab.tabIndex=on?0:-1}frame.title=button.textContent;preview.setAttribute("aria-labelledby",button.id);if(focus)button.focus()}
tabs.forEach((b,i)=>{b.onclick=()=>{select(b);frame.src=b.dataset.path};b.onkeydown=e=>{const n=e.key==='ArrowRight'?(i+1)%tabs.length:e.key==='ArrowLeft'?(i+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;if(n===null)return;e.preventDefault();select(tabs[n],true);frame.src=tabs[n].dataset.path}});
frame.addEventListener('load',()=>{try{const path=frame.contentWindow.location.pathname;const tab=tabs.find(t=>t.dataset.path===path);if(tab)select(tab)}catch{}});
document.querySelector('#phone').onclick=e=>{const on=preview.classList.toggle('mobile');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'PC幅':'スマホ幅'};
document.querySelector('#expand').onclick=()=>document.body.classList.add('presentation');document.querySelector('#exit').onclick=()=>document.body.classList.remove('presentation');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('presentation')});
</script></body></html>
