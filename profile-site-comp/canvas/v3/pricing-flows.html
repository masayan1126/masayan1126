<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light"><title>PR見積もりの操作を3案で比べる</title><link rel="icon" href="data:,"><style>%%STYLE%%</style></head>
<body>
<header class="review-header"><div class="review-heading"><span class="review-eyebrow">見積もり画面の提案</span><p>選んで、見積書をつくる。</p><span class="review-status">操作できる試作・本番未反映</span></div>
<nav class="pattern-tabs" role="tablist" aria-label="3つの操作案">
<button role="tab" id="tab-a" data-pattern="a" aria-selected="true" aria-controls="demo" tabindex="0"><b>A</b><span>1問ずつ進む<small>おすすめ</small></span></button>
<button role="tab" id="tab-b" data-pattern="b" aria-selected="false" aria-controls="demo" tabindex="-1"><b>B</b><span>質問を開いて選ぶ</span></button>
<button role="tab" id="tab-c" data-pattern="c" aria-selected="false" aria-controls="demo" tabindex="-1"><b>C</b><span>質問を一覧で答える</span></button>
</nav><p id="pattern-note" class="pattern-note"></p></header>
<main id="demo" role="tabpanel" aria-labelledby="tab-a" data-pattern="a">
<div class="site-top"><span class="brand">Miyabiya Studio</span><span>PR制作・掲載</span></div>
<section class="intro"><p class="eyebrow">PR VIDEO ESTIMATE</p><h1>PR動画制作の見積もり</h1><p>つくりたいものと、お任せしたい範囲を選んでください。<br class="desktop-break">最後に、金額と明細をまとめた概算見積書ができます。</p></section>
<div id="workspace"></div>
<p class="trial-note">この試作では公開中の料金を使います。単独ショート・X投稿など、料金や条件が未確定の項目は「要相談」です。回答は3案で共通なので、同じ内容で操作を比べられます。</p>
</main>
<dialog id="inquiry-dialog" aria-labelledby="inquiry-title"><div class="dialog-top"><h2 id="inquiry-title">相談内容のプレビュー</h2><button type="button" data-close-dialog aria-label="閉じる">×</button></div><p>選んだ内容と概算金額を確認できます。この画面からメールは送信されません。</p><textarea id="inquiry-text" readonly aria-label="問い合わせ本文"></textarea><button class="button primary" data-close-dialog>見積書へ戻る</button></dialog>
<div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script>%%SCRIPT%%</script></body></html>
